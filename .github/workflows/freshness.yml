name: Freshness
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'scripts/catalog.mjs'
      - '.github/workflows/freshness.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: catalog-freshness
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run check
      - name: Check live Homebrew metadata
        id: audit
        continue-on-error: true
        run: npm run audit
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-freshness
          path: reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update review issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- mac-dev-setup-freshness -->';
            const report = fs.existsSync('reports/freshness.md') ? fs.readFileSync('reports/freshness.md', 'utf8') : 'Check failed before a report was generated. Inspect the workflow logs.';
            const body = marker + '\n\n' + report + '\n[Workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n\nReview sources, then run npm run refresh and commit the reviewed diff. Do not interpret metadata checks as clean-Mac installation tests.';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]'});
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title: 'Catalog freshness review', body});
      - name: Mark incomplete or stale checks
        if: steps.audit.outcome == 'failure'
        run: exit 1
